<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="description" content="Doneo — трекер задач на React и Vite: серверная авторизация, drag-and-drop, три языка (UZ/RU/EN), тёмная и светлая тема, экспорт в CSV и JSON" />
    <title>Doneo — трекер задач</title>
    <script>
      // Ранняя установка темы, чтобы не было "мигания" при загрузке.
      // Ключ "tt.theme" — от версии Task Tracker, поддерживается для совместимости.
      try {
        var raw = localStorage.getItem('doneo.theme') || localStorage.getItem('tt.theme')
        var savedTheme = JSON.parse(raw || '"dark"')
        savedTheme = savedTheme === 'light' ? 'light' : 'dark'
        document.documentElement.dataset.theme = savedTheme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', savedTheme === 'light' ? '#eef0f6' : '#0b0b0f')
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
