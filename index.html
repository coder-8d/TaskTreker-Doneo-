<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101512" />
    <meta name="description" content="Doneo — трекер задач на React и Vite: серверная авторизация, drag-and-drop, три языка (UZ/RU/EN), тёмная и светлая тема, экспорт в CSV и JSON" />
    <title>Doneo — трекер задач</title>
    <script>
      // Ранняя установка темы, чтобы не было "мигания" при загрузке.
      // Ключ "tt.theme" — от версии Task Tracker, поддерживается для совместимости.
      try {
        var raw = localStorage.getItem('doneo.theme') || localStorage.getItem('tt.theme')
        var mode = JSON.parse(raw || '"dark"')
        if (mode !== 'light' && mode !== 'dark' && mode !== 'auto') mode = 'dark'
        // В режиме auto тема определяется локальным временем: 06:00-20:59 светлая.
        var h = new Date().getHours()
        var savedTheme = mode === 'auto' ? (h >= 6 && h < 21 ? 'light' : 'dark') : mode
        document.documentElement.dataset.theme = savedTheme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', savedTheme === 'light' ? '#f4f6f4' : '#101512')
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
